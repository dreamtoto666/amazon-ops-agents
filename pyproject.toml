[project]
name = "amazon-ops-agents"
version = "0.1.0"
description = "Amazon operations multi-agent controller powered by LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=23.1,<24.0",
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "langgraph>=1.0,<2.0",
  "langsmith>=0.10,<1.0",
  "mcp>=2.0,<3.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "pydantic>=2.10,<3.0",
  "python-dotenv>=1.0,<2.0",
  "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amazon_ops"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
